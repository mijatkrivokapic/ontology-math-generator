}

  const b = bojaCvora(id);
  if (vestina[id]) {
    return { id, label: skrati(vestina[id].opis, 46), level: std[vestina[id].standard].nivo * 2 + 1,
      shape:'box', widthConstraint:{maximum:170}, font:{size:11, color:b.font},
      color:{background:b.background, border:b.border, highlight:{background:b.background, border:'#9a6700'}, hover:{background:b.background, border:'#9a6700'}},
      borderWidth:1, margin:6 };
  }
  const s = std[id];
  const lab = s.id + (s.vestine.length ? '\n' + s.vestine.length + ' ' + mnozina(s.vestine.length) : '');
  return { id, label: lab, level: s.nivo * 2, shape:'box', font:{size:15, color:b.font, multi:false},
    color:{background:b.background, border:b.border, highlight:{background:b.background, border:'#cf222e'}, hover:{background:b.background, border:'#cf222e'}},
    borderWidth: s.jezgro ? 2 : 1, margin:10 };
}
function osnovnaIvica(e) {
  const crt = e.tip === 'isPartOf' || e.tip === 'supports';
  return { id:e.id, from:e.from, to:e.to, tip:e.tip, arrows: e.tip === 'supports' ? '' : 'to', dashes: crt,
    width: 1.2, color:boja('#8c959f'), smooth:{type:'cubicBezier', forceDirection:'horizontal', roundness:0.45} };
}

function izgradi() {
  const sVestinama = document.getElementById('prikaziVestine').checked;
  cvorovi.clear(); ivice.clear();
  P.standardi.forEach(s => cvorovi.add(osnovniCvor(s.id)));
  P.veze.forEach((v, i) => ivice.add(osnovnaIvica({id:'e'+i, from:v.od, to:v.ka, tip:v.tip})));
  if (sVestinama) {
    Object.keys(vestina).forEach(id => {
      cvorovi.add(osnovniCvor(id));
      ivice.add(osnovnaIvica({id:'s_'+id, from:vestina[id].standard, to:id, tip:'supports'}));
    });
  }
  izabrano = null;
  document.getElementById('panel').innerHTML = PODRAZ;
  setTimeout(() => mreza.fit({animation:false}), 50);
}

const mreza = new vis.Network(document.getElementById('platno'), {nodes:cvorovi, edges:ivice}, {
  layout: { hierarchical: { direction:'LR', sortMethod:'directed', levelSeparation:150, nodeSpacing:62, treeSpacing:90, shakeTowards:'roots' } },
  physics: false,
  interaction: { hover:true, tooltipDelay:150, selectConnectedEdges:false },
  edges: { arrows: { to: { scaleFactor:0.6 } } },
});

let izabrano = null;

function istakni(id) {
  izabrano = id;
  const povezane = new Set(mreza.getConnectedEdges(id));
  const susedi = new Set(mreza.getConnectedNodes(id)); susedi.add(id);
  ivice.update(ivice.get().map(e => povezane.has(e.id)
    ? { id:e.id, width:4.5, color:boja(e.to === id ? '#1a7f37' : '#cf222e') }
    : { id:e.id, width:0.8, color:boja('#e4e8ec') }));
  cvorovi.update(cvorovi.get().map(n => {
    if (susedi.has(n.id)) { const b = bojaCvora(n.id);
      return { id:n.id, color:{background:b.background, border: n.id === id ? '#cf222e' : b.border, highlight:{background:b.background, border:'#cf222e'}}, font:{color:b.font}, borderWidth: n.id === id ? 4 : 2 }; }
    return { id:n.id, color:{background:SIVA.background, border:SIVA.border, highlight:{background:SIVA.background, border:SIVA.border}}, font:{color:SIVA.font}, borderWidth:1 };
  }));
  prikaziDetalje(id);
}

function ponisti() {
  izabrano = null;
  ivice.update(ivice.get().map(e => ({ id:e.id, width:1.2, color:boja('#8c959f') })));
  cvorovi.update(cvorovi.get().map(n => { const b = bojaCvora(n.id);
    return { id:n.id, color:{background:b.background, border:b.border, highlight:{background:b.background, border:'#cf222e'}}, font:{color:b.font}, borderWidth: (std[n.id] && std[n.id].jezgro) ? 2 : 1 }; }));
  document.getElementById('panel').innerHTML = PODRAZ;
}

function link(id) { return '<a class="cvor" data-id="' + id + '">' + id + '</a>'; }
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function prikaziDetalje(id) {
  const el = document.getElementById('panel');
  if (vestina[id]) {
    const v = vestina[id];
    el.innerHTML = '<span class="znak" style="background:#fff8c5;color:#7d4e00">veština (learning component)</span>' +
      '<h3 style="margin-top:8px">' + esc(v.opis) + '</h3>' +
      '<h4>Podržava standard</h4>' + link(v.standard) + ' — ' + esc(skrati(std[v.standard].opis, 140)) +
      '<h4>Identifikator</h4><div class="uuid">' + v.id.slice(3) + '</div>';
  } else {
    const s = std[id];
    const pre = P.veze.filter(v => v.ka === id).map(v => v.od);
    const posle = P.veze.filter(v => v.od === id).map(v => v.ka);
    const lista = (a, prazno) => a.length ? '<ul>' + a.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '<span class="nap">' + prazno + '</span>';
    el.innerHTML =
      '<span class="znak' + (s.jezgro ? '' : ' siv') + '">' + (s.jezgro ? 'jezgro linearnih funkcija' : 'kontekst') + '</span>' +
      '<span class="znak siv">razred ' + s.razred + '</span>' +
      '<h3 style="margin-top:8px">' + s.id + '</h3>' +
      '<div>' + esc(s.opis) + '</div>' +
      '<h4>Preduslovi (' + pre.length + ') <span style="color:#1a7f37">●</span></h4>' +
      lista(pre.map(x => link(x) + ' <span class="nap">' + esc(skrati(std[x].opis, 70)) + '</span>'), 'nema u Coherence Map') +
      '<h4>Vodi ka (' + posle.length + ') <span style="color:#cf222e">●</span></h4>' +
      lista(posle.map(x => link(x) + ' <span class="nap">' + esc(skrati(std[x].opis, 70)) + '</span>'), 'nije preuzeto ili nema') +
      '<h4>Veštine (' + s.vestine.length + ')</h4>' +
      lista(s.vestine.map(v => esc(v.opis)), 'nisu preuzete za ovaj standard') +
      (s.miskoncepcije.length ? '<h4>Miskoncepcije (' + s.miskoncepcije.length + ')</h4>' +
        lista(s.miskoncepcije.map(m => esc(m.opis)), '') +
        '<p class="nap">Izvor: Eedi, povezano sa standardom po sličnosti teksta, pa proveriti ručno.</p>' : '') +
      '<h4>CASE UUID</h4><div class="uuid">' + s.uuid + '</div>';
  }
  el.querySelectorAll('a.cvor').forEach(a => a.onclick = () => {
    const t = a.dataset.id; mreza.selectNodes([t]); istakni(t); mreza.focus(t, {scale:1.0, animation:{duration:400}});
  });
  el.scrollTop = 0;
}

mreza.on('click', p => { if (p.nodes.length) istakni(p.nodes[0]); else ponisti(); });
document.getElementById('prikaziVestine').onchange = izgradi;
document.getElementById('uklopi').onclick = () => mreza.fit({animation:{duration:400}});
izgradi();
</script>
</body></html>
